<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Custom Quote</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f9f9f9] text-gray-800">

  <section class="max-w-4xl mx-auto px-6 py-16">
    <!-- Heading -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-900 mb-3">Get Custom Quote</h1>
      <p class="text-gray-600 text-base">
        Fill out the form below to receive a personalized quote for your packaging needs.
      </p>
    </div>

    <!-- Form -->
    <form class="bg-white shadow-xl rounded-xl p-8 space-y-6" action="/submit-quote" method="POST">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" name="name" placeholder="John Doe" required
                 class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" name="email" placeholder="you@example.com" required
                 class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700">Product Type</label>
          <input type="text" name="product" placeholder="e.g., Custom Mailer Box"
                 class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700">Quantity</label>
          <input type="number" name="quantity" placeholder="e.g., 1000"
                 class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>
      </div>

      <div>
        <label class="block mb-1 text-sm font-medium text-gray-700">Message / Additional Requirements</label>
        <textarea name="message" rows="4" placeholder="Describe your design preferences, dimensions, materials, etc."
                  class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
      </div>

      <div class="text-center">
        <button type="submit"
                class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-6 py-3 rounded-md transition">
          Submit Quote Request
        </button>
      </div>
    </form>
  </section>

</body>
</html>
